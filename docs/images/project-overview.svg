    <style>
      .font{font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}.title{font-size:72px;font-weight:900;letter-spacing:0;fill:#111713}.subtitle{font-size:24px;font-weight:650;fill:#546158}.eyebrow{font-size:20px;font-weight:850;fill:#007DBE;letter-spacing:1px}.cardTitle{font-size:27px;font-weight:850;fill:#111713}.cardBody{font-size:19px;font-weight:600;fill:#546158}.small{font-size:17px;font-weight:700;fill:#546158}.label{font-size:16px;font-weight:850;fill:#8B958D;letter-spacing:.8px}.pillText{font-size:17px;font-weight:850;fill:#0D0F0E}
    </style>
