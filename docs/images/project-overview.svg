<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#F8FBFF"/><stop offset="0.56" stop-color="#F2F8FC"/><stop offset="1" stop-color="#EEF7F2"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C8FF"/><stop offset="1" stop-color="#7C8CF8"/></linearGradient>
