<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon-dark.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f0e" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="1RM 계산기 — 웨이트 트레이닝 기록 및 분석" />
    <meta property="og:title" content="1RM 계산기" />
    <meta property="og:description" content="웨이트 트레이닝 기록 및 분석 도구" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <title>1RM 계산기</title>
    <script>
      (() => {
        const setFavicon = (isDark) => {
          const favicon = document.getElementById("app-favicon");
          if (favicon) favicon.href = isDark ? "/favicon-dark.svg" : "/favicon-light.svg";
        };

        try {
          const saved = JSON.parse(localStorage.getItem("1rm-ui") || "{}");
          const isDark = saved?.state?.isDark ?? true;
          document.documentElement.classList.toggle("dark", isDark);
          document.documentElement.classList.toggle("light", !isDark);
          setFavicon(isDark);
        } catch {
          document.documentElement.classList.add("dark");
          setFavicon(true);
        }
      })();
    </script>
    <style>
      html.light body { background: #f6f7f2; }
      html.dark body, body { background: #0d0f0e; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
